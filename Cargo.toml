[workspace]
members = ["local-rcu-left-right"]
resolver = "2"

[package]
name = "local-rcu"
version = "1.0.8"
edition = "2021"
authors = [ "Cody P Schafer <dev@codyps.com>"]
license = "OSL-3.0"
description = "RCU with a safe API and local collection of old values"
readme = "README.md"
homepage = "https://github.com/codyps/local-rcu"
documentation = "https://docs.rs/local-rcu"
repository = "https://github.com/codyps/local-rcu"

[dependencies]
slab = "0.4.9"

[target.'cfg(loom)'.dependencies]
loom = { version = "0.7.1", features = [ "checkpoint" ] }

# when building with `--cfg loom`, event-listener's `loom` feature must be
# enabled so its own `cfg(loom)` code paths have the loom crate available
[target.'cfg(loom)'.dev-dependencies]
event-listener = { version = "5.4", features = ["loom"] }

[dev-dependencies]
trybuild = "1.0.85"
criterion = { version = "0.8.2" }
event-listener = "5.4.2"

[[bench]]
name = "b"
harness = false

[[bench]]
name = "isolated"
harness = false

[profile.release]
debug = true

