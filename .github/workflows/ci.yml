on:
  pull_request:
  push:
env:
  RUST_BACKTRACE: "1"
name: "ci"
jobs:
  clippy_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Run the Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          # we're not on FlakeHub; skip its opportunistic auth attempt
          use-flakehub: false
      - name: Run Clippy
        run: nix develop .#clippy --command cargo clippy --all-targets --all-features
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Run the Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          # we're not on FlakeHub; skip its opportunistic auth attempt
          use-flakehub: false
      - run: nix develop .#fmt --command cargo fmt --check
  with-nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Run the Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          # we're not on FlakeHub; skip its opportunistic auth attempt
          use-flakehub: false
      - name: Build
        run: nix build .#default
  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Run the Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          # we're not on FlakeHub; skip its opportunistic auth attempt
          use-flakehub: false
      - name: Build everything
        run: nix develop --command cargo build --all-targets
      - name: Run tests
        run: nix develop --command cargo test --all-targets
      - name: Run loom tests
        run: nix develop --command ./loom.sh -- loom
  with-cargo:
    runs-on: ubuntu-latest
    strategy:
      # don't cancel sibling jobs on failure: one compiler mismatch
      # shouldn't hide the results of the others
      fail-fast: false
      matrix:
        # keep in sync with the lockfile: dev-deps require >= 1.85
        # (edition2024), trybuild@1.0.122 declares rust-version 1.88
        rust_version: [stable, beta, 1.88.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master@2026-10-16
        with:
          toolchain: ${{ matrix.rust_version}}
      - run: cargo build --all-targets
      # the trybuild stderr file tracks a single compiler's diagnostics
      # (validated in the loom job, which uses one nix-provided toolchain);
      # rustup toolchains render some snippets slightly differently (and
      # drift between releases), so skip that one test here
      - run: cargo test -- --skip compile_fail
