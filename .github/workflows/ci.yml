name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# least privilege (release-plz.yml needs write and declares its own)
permissions:
  contents: read

# cancel superseded runs (eg new pushes to an open PR)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Run the Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          # we're not on FlakeHub; skip its opportunistic auth attempt
          use-flakehub: false
      - name: rustfmt
        run: nix develop .#fmt --command cargo fmt --check
      - name: clippy
        run: nix develop .#clippy --command cargo clippy --workspace --all-targets --all-features -- -D warnings
  with-nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Run the Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          # we're not on FlakeHub; skip its opportunistic auth attempt
          use-flakehub: false
      - name: Build
        run: nix build .#default
  loom:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Run the Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          # we're not on FlakeHub; skip its opportunistic auth attempt
          use-flakehub: false
      - name: Build everything
        run: nix develop --command cargo build --workspace --all-targets
      - name: Run tests
        run: nix develop --command cargo test --workspace --all-targets
      - name: Run loom tests
        run: nix develop --command ./loom.sh -- loom
      - name: Run examples
        run: |
          nix develop --command cargo run --example left_right
          nix develop --command cargo run --example watch
  with-cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # don't cancel sibling jobs on failure: one compiler mismatch
      # shouldn't hide the results of the others
      fail-fast: false
      matrix:
        # keep in sync with the lockfile: dev-deps require >= 1.85
        # (edition2024), trybuild@1.0.122 declares rust-version 1.88
        rust_version: [stable, beta, 1.88.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master@2026-10-16
        with:
          toolchain: ${{ matrix.rust_version}}
      - run: cargo build --workspace --all-targets
      # the trybuild stderr file tracks a single compiler's diagnostics
      # (validated in the loom job, which uses one nix-provided toolchain);
      # rustup toolchains render some snippets slightly differently (and
      # drift between releases), so skip that one test here
      - run: cargo test --workspace -- --skip compile_fail
