name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# least privilege (release-plz.yml needs write and declares its own)
permissions:
  contents: read

# cancel superseded runs (eg new pushes to an open PR)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Run the Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          # we're not on FlakeHub; skip its opportunistic auth attempt
          use-flakehub: false
      - name: rustfmt
        run: nix develop .#fmt --command cargo fmt --check
      - name: clippy
        run: nix develop .#clippy --command cargo clippy --workspace --all-targets --all-features -- -D warnings
  with-nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Run the Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          # we're not on FlakeHub; skip its opportunistic auth attempt
          use-flakehub: false
      - name: Build
        run: nix build .#default
  loom:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Run the Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          # we're not on FlakeHub; skip its opportunistic auth attempt
          use-flakehub: false
      - name: Build everything
        run: nix develop --command cargo build --workspace --all-targets
      - name: Run tests
        run: nix develop --command cargo test --workspace --all-targets
      - name: Run loom tests
        # The loom we build against (see `[patch.crates-io]` in Cargo.toml)
        # explores far more executions than the one on crates.io, so each
        # test explores them with two workers.
        env:
          LOOM_WORKERS: 2
        run: nix develop --command ./loom.sh -- loom
      - name: Run examples
        run: |
          nix develop --command cargo run --example left_right
          nix develop --command cargo run --example watch
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master@2026-10-16
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # skip `compile_fail` (trybuild): it drives external cargo/rustc processes,
      # which miri cannot interpret (covered by the loom & with-cargo jobs).
      # The loom tests are #[cfg(loom)]-gated and compile to nothing here: loom's
      # interleaving model and miri's memory-model emulation check disjoint things
      # (loom cannot express store-buffer staleness; miri cannot model check).
      - run: cargo miri test --workspace -- --skip compile_fail
      # 32-bit: a `usize` epoch of half the width, and other layouts.
      # miri builds its own std for the target, but a dev-dependency (criterion, through
      # `alloca`) compiles C in its build script, and that needs the 32-bit libc headers.
      - name: Install a 32-bit C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: 32-bit target
        run: cargo miri test --workspace --target i686-unknown-linux-gnu -- --skip compile_fail
  # The miri job tries one thread schedule per test. Each seed here is another one, with
  # other choices of which (stale) value a load returns: this is what looks for the
  # store-buffering outcome and for accesses that nothing orders before a free.
  # A job of its own because it is the slow part (the seeds run in parallel, one per core).
  miri-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master@2026-10-16
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Only the tests that use threads: the others do the same thing under every seed.
      # Without `send_100_from_1_to_m`: it takes minutes per seed under miri, and what it
      # does is covered by `reentry_never_observes_collected_value`.
      - name: Seed sweep of the threaded tests
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..16 -Zmiri-strict-provenance
        run: |
          cargo miri test -p local-rcu --test a --test cached -- --skip send_100_from_1_to_m
          cargo miri test -p local-rcu-left-right --test multi_thread
  # Each ordering and fence the safety argument rests on is weakened in turn; a test has to
  # fail every time (see mutants.sh). This tests the tests: without it, an ordering could be
  # weakened by mistake and loom & miri above would still pass.
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master@2026-10-16
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: ./mutants.sh
  with-cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # don't cancel sibling jobs on failure: one compiler mismatch
      # shouldn't hide the results of the others
      fail-fast: false
      matrix:
        # keep in sync with the lockfile: dev-deps require >= 1.85
        # (edition2024), trybuild@1.0.122 declares rust-version 1.88
        rust_version: [stable, beta, 1.88.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master@2026-10-16
        with:
          toolchain: ${{ matrix.rust_version}}
      - run: cargo build --workspace --all-targets
      # the trybuild stderr file tracks a single compiler's diagnostics
      # (validated in the loom job, which uses one nix-provided toolchain);
      # rustup toolchains render some snippets slightly differently (and
      # drift between releases), so skip that one test here
      - run: cargo test --workspace -- --skip compile_fail
