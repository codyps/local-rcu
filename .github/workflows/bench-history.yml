name: bench-history

# Record benchmark results for every commit of main and publish a GitHub
# Pages site showing them over time.
#
# - the bench jobs run `benches/isolated.rs` on x86_64 and aarch64 (the
#   measurements design decisions are made on: instructions and allocations
#   per operation, memory, time per read and per write), parse the
#   output into one JSON record per (commit, arch), and append it as
#   `data/<commit>.json` to that arch's *orphan* data branch
#   (`bench-data-x86_64` / `bench-data-aarch64`: no shared history with
#   main, one small file per recorded run).
# - the pages job regenerates a static Chart.js site from all recorded
#   data and deploys it to GitHub Pages via actions (no site branch), and
#   attaches a human-readable benchmark summary as a git note to the
#   commit (visible in `git show` and on the GitHub commit page).

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # weekly drift sample of the current head of main
    - cron: "23 5 * * 0"

# data + notes branches are pushed and Pages deployed with the workflow token
permissions:
  contents: write
  pages: write
  id-token: write

# avoid overlapping runs racing on the gh-pages push; superseded runs are
# cancelled (their commit is superseded anyway)
concurrency:
  group: bench-history-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  bench:
    name: record-${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
            branch: bench-data-x86_64
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
            branch: bench-data-aarch64
    env:
      BRANCH: ${{ matrix.branch }}
      ARCH: ${{ matrix.arch }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master@2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: bench-history-${{ matrix.arch }}

      - name: Install valgrind (counts instructions)
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Run benchmarks
        run: |
          # more passes than the default: this is the only run of this commit
          BENCH_PASSES=5 cargo bench --bench isolated | tee isolated.txt
          # hardware context for the record (shared-runner pools are
          # heterogeneous; trends must be attributable to a cpu model)
          lscpu | tee lscpu.txt
          uname -a | tee uname.txt

      - name: Parse results
        run: |
          COMMIT_SHA="$SHA" \
          COMMIT_DATE="$(git show -s --format=%cI HEAD)" \
          RUSTC_VERSION="$(rustc -V)" \
            python3 .github/scripts/bench_parse.py \
              "record-$ARCH.json" "$ARCH" lscpu.txt "$(cat uname.txt)" \
              isolated.txt

      - name: Append record to the orphan data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin "$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout --orphan "$BRANCH"
            git rm -rf .
          fi
          mkdir -p data hardware
          cp "record-$ARCH.json" "data/$SHA.json"
          # full lscpu dump, deduplicated: one file per distinct runner config
          HW_SHA=$(sha256sum lscpu.txt | cut -d' ' -f1)
          if [ ! -f "hardware/$HW_SHA.txt" ]; then
            cp lscpu.txt "hardware/$HW_SHA.txt"
          fi
          git add data hardware
          git commit -m "bench: $ARCH $SHA"
          git push origin "$BRANCH"

  pages:
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # one-time: switch Pages to deployment-by-workflow
          enablement: true
      - name: Collect recorded data
        run: |
          git fetch --depth=1 origin bench-data-x86_64 bench-data-aarch64
          mkdir -p data-x86_64 data-aarch64
          collect() {
            for f in $(git ls-tree -r --name-only "origin/$1" -- data); do
              git show "origin/$1:$f" > "$2/$(basename "$f")"
            done
            # full runner dumps, saved next to the records they belong to
            for f in $(git ls-tree -r --name-only "origin/$1" -- hardware || true); do
              git show "origin/$1:$f" > "$2/$(basename "$f")"
            done
          }
          collect bench-data-x86_64 data-x86_64
          collect bench-data-aarch64 data-aarch64
      - name: Generate site
        run: |
          # generate outside the worktree: the deploy uploads from there
          python3 .github/scripts/gen_pages.py --renames benches/renames.txt \
            "$RUNNER_TEMP/site/index.html" data-x86_64 data-aarch64
      - name: Attach benchmark summary note to the commit
        run: |
          git fetch origin refs/notes/commits:refs/notes/commits || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/bench_note.py "$SHA" \
            data-x86_64 data-aarch64 > "$RUNNER_TEMP/note.txt"
          git notes add -f -F "$RUNNER_TEMP/note.txt" "$SHA"
          git push origin refs/notes/commits
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # `with:` inputs are literal: use the expression form, not $RUNNER_TEMP
          path: ${{ runner.temp }}/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
