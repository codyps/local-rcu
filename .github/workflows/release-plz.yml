name: Release-plz

permissions: {}

on:
  push:
    branches:
      - main
  workflow_dispatch:

# serialize release runs: parallel runs would race on changelog + tag creation
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-pr:
    name: Prepare release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master@2026-10-16
        with:
          toolchain: stable
      - name: Create release PR token
        # When configured (see rust-systemd), open/update the release PR as a GitHub App instead
        # of github-actions[bot], so CI runs on the release PR automatically.
        if: vars.RELEASE_PLZ_APP_CLIENT_ID != ''
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update the release PR
        uses: MarcoIeni/release-plz-action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

  release:
    name: Publish release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read
      # crates.io trusted publishing: release-plz exchanges this workflow's OIDC
      # identity for a short-lived registry token, so no CARGO_REGISTRY_TOKEN is
      # needed. The trusted publisher must be configured on crates.io for this
      # crate (repository codyps/local-rcu, workflow .github/workflows/release-plz.yml,
      # environment release).
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master@2026-10-16
        with:
          toolchain: stable
      - name: Publish
        uses: MarcoIeni/release-plz-action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
